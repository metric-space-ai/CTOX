name: Native Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-sync.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/core/sync/**'
      - 'src/core/sync_host/**'
      - 'src/core/sync_host.rs'
      - 'src/core/rxdb/**'
      - 'src/apps/business-os/rxdb/tests/native-transport-parity-smoke.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-sync.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/core/sync/**'
      - 'src/core/sync_host/**'
      - 'src/core/sync_host.rs'
      - 'src/core/rxdb/**'
      - 'src/apps/business-os/rxdb/tests/native-transport-parity-smoke.mjs'

permissions:
  contents: read

jobs:
  native-sync:
    name: Native Sync (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ctox
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Configure disposable build storage
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf 'CARGO_TARGET_DIR=%s/ctox-native-sync-target\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: ctox
      - name: Checkout the actual Workjet IPC consumer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: metric-space-ai/workjet
          ref: ca7dd885f3615ff31b18eb6ffb6c7c58c45ceaf3
          path: workjet
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.13.1'
      - name: Install the pinned Workjet workspace dependencies
        working-directory: workjet
        run: npm exec --yes --package=pnpm@11.10.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: native-sync-production-transport
          workspaces: |
            ctox/src/core/sync -> ${{ runner.temp }}/ctox-native-sync-target
            ctox/src/core/rxdb -> ${{ runner.temp }}/ctox-native-sync-target
      - name: Require production transport versions and ICE patch
        run: node src/apps/business-os/rxdb/tests/native-transport-parity-smoke.mjs
      - name: Format
        run: |
          cargo fmt --check --manifest-path src/core/sync/Cargo.toml
          cargo fmt --check --manifest-path src/core/rxdb/Cargo.toml
      - name: Native authority, lifecycle and real WebRTC scenarios
        run: cargo test --locked --no-fail-fast --manifest-path src/core/sync/Cargo.toml --features webrtc
      - name: Native RxDB tests with production ICE patch
        run: cargo test --locked --manifest-path src/core/rxdb/Cargo.toml
      - name: Native Sync lint
        run: cargo clippy --locked --manifest-path src/core/sync/Cargo.toml --features webrtc --all-targets -- -D warnings
