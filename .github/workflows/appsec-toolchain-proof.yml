name: AppSec Toolchain Proof

on:
  pull_request:
    paths:
      - ".github/workflows/appsec-toolchain-proof.yml"
      - "src/tools/appsec-pentest/**"
      - "src/skills/packs/security/appsec-pentest/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "AppSec scanner profile to prove"
        required: true
        default: "full"
        type: choice
        options:
          - minimal
          - standard
          - full
      include_data_bundles:
        description: "Fetch pinned templates, wordlists, and Trivy DB cache"
        required: true
        default: true
        type: boolean
      attest_native:
        description: "Record current nmap/ncat/ndiff checksums after platform install"
        required: true
        default: true
        type: boolean
      smoke_timeout_seconds:
        description: "Per-scanner smoke timeout"
        required: true
        default: "45"
        type: string
      platform_scope:
        description: "Run the complete matrix or one focused platform acceptance"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows-only
          - macos-intel-only

permissions:
  contents: read

concurrency:
  group: appsec-toolchain-proof-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event_name == 'pull_request' && 'standard' || 'full' }}-${{ inputs.platform_scope || 'all' }}
  cancel-in-progress: false

jobs:
  proof:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-22.04","platform":"linux-x86_64","label":"Linux x86_64 deployment audit proof"}]' || inputs.platform_scope == 'windows-only' && '[{"os":"windows-latest","platform":"windows-x86_64","label":"Windows x86_64 deployment audit proof"}]' || inputs.platform_scope == 'macos-intel-only' && '[{"os":"macos-15-intel","platform":"macos-x86_64","label":"macOS x86_64 deployment audit proof"}]' || '[{"os":"ubuntu-22.04","platform":"linux-x86_64","label":"Linux x86_64 deployment audit proof"},{"os":"ubuntu-24.04-arm","platform":"linux-aarch64","label":"Linux aarch64 deployment audit proof"},{"os":"macos-latest","platform":"macos-aarch64","label":"macOS aarch64 deployment audit proof"},{"os":"macos-15-intel","platform":"macos-x86_64","label":"macOS x86_64 deployment audit proof"},{"os":"windows-latest","platform":"windows-x86_64","label":"Windows x86_64 deployment audit proof"}]') }}

    env:
      CARGO_TERM_COLOR: always
      APPSEC_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || github.event_name == 'pull_request' && 'standard' || 'full' }}
      APPSEC_INCLUDE_DATA_BUNDLES: ${{ github.event_name != 'workflow_dispatch' || inputs.include_data_bundles }}
      APPSEC_ATTEST_NATIVE: ${{ github.event_name != 'workflow_dispatch' || inputs.attest_native }}
      APPSEC_SMOKE_TIMEOUT_SECONDS: ${{ inputs.smoke_timeout_seconds || '45' }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AppSec proof paths
        shell: bash
        run: |
          {
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/ctox-cargo-target"
            echo "APPSEC_PROOF_ROOT=$RUNNER_TEMP/ctox-appsec-proof"
            echo "APPSEC_PLATFORM=${{ matrix.platform }}"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.93.0"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # Semgrep 1.172.0's current dependency set is not importable on
          # Python 3.13. Keep the proof on its supported, reproducible ABI.
          python-version: "3.12"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          # osv-scanner 2.4.0 requires >=1.26.4; syft 1.51.0 requires
          # >=1.26.3. GOTOOLCHAIN stays local so the workflow owns the exact
          # compiler instead of allowing an installer-time network upgrade.
          go-version: "1.26.4"
          check-latest: true

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux native AppSec packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(nmap ncat ndiff curl meson ninja-build libcap-dev git ca-certificates pkg-config libssl-dev libfontconfig1-dev libpcap-dev)
          sudo apt-get install -y "${packages[@]}"
          src/scripts/install-appsec-bubblewrap.sh

          native_bin="$RUNNER_TEMP/appsec-native/bin"
          native_src="$RUNNER_TEMP/appsec-native/src"
          mkdir -p "$native_bin" "$native_src"
          case "$(uname -m)" in
            x86_64)
              dalfox_platform="linux-x86_64"
              dalfox_sha256="ef48d30c183cead88eb89da10bdc1a7fa58a484d175319096075b470f3652fd4"
              clamav_platform="x86_64"
              clamav_sha256="28d6efc5b4423e7830c3559339552eb53870a9eac51ac4efb37d60530d329886"
              ;;
            aarch64|arm64)
              dalfox_platform="linux-aarch64"
              dalfox_sha256="b61dc832582e738dc5b838197d28b6d0d4d33de2d849fc73741635fc380f0348"
              clamav_platform="aarch64"
              clamav_sha256="4bdab4118e8accb02108316b996d7c14da1cccc4eea2dff7bea82109f9239d95"
              ;;
            *)
              echo "Unsupported Linux architecture for Dalfox: $(uname -m)" >&2
              exit 1
              ;;
          esac
          dalfox_archive="$RUNNER_TEMP/dalfox-v3.1.2-${dalfox_platform}.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/hahwul/dalfox/releases/download/v3.1.2/dalfox-v3.1.2-${dalfox_platform}.tar.gz" \
            --output "$dalfox_archive"
          printf '%s  %s\n' "$dalfox_sha256" "$dalfox_archive" | sha256sum --check --strict
          tar -xzf "$dalfox_archive" -C "$native_src"
          install -m 0755 "$native_src/dalfox-v3.1.2-${dalfox_platform}/dalfox" "$native_bin/dalfox"

          if [ "$APPSEC_PROFILE" = "full" ]; then
            clamav_archive="$RUNNER_TEMP/clamav-1.5.4.linux.${clamav_platform}.deb"
            clamav_root="$native_src/clamav-1.5.4"
            curl --fail --location --silent --show-error \
              "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.linux.${clamav_platform}.deb" \
              --output "$clamav_archive"
            printf '%s  %s\n' "$clamav_sha256" "$clamav_archive" | sha256sum --check --strict
            mkdir -p "$clamav_root"
            dpkg-deb --extract "$clamav_archive" "$clamav_root"
            clamav_prefix="$clamav_root/usr/local"
            if [ ! -d "$clamav_prefix/etc/certs" ] || [ -L "$clamav_prefix/etc/certs" ]; then
              echo "ClamAV CVD certificate directory is missing or is a symlink" >&2
              exit 1
            fi
            clamav_distribution_root=$(realpath "$clamav_prefix")
            clamav_certs_dir=$(realpath "$clamav_prefix/etc/certs")
            if [ "$clamav_certs_dir" != "$clamav_distribution_root/etc/certs" ] || [ ! -d "$clamav_certs_dir" ]; then
              echo "ClamAV CVD certificate directory is missing or escaped its checksum-verified distribution" >&2
              exit 1
            fi
            clamav_certs_manifest="$RUNNER_TEMP/clamav-1.5.4-certs.manifest"
            : > "$clamav_certs_manifest"
            clamav_certs_file_count=0
            clamav_certs_total_bytes=0
            while IFS= read -r -d '' clamav_cert_entry; do
              if [ -L "$clamav_cert_entry" ]; then
                echo "ClamAV CVD certificate tree contains a symlink: $clamav_cert_entry" >&2
                exit 1
              fi
              if [ -d "$clamav_cert_entry" ]; then
                continue
              fi
              if [ ! -f "$clamav_cert_entry" ]; then
                echo "ClamAV CVD certificate tree contains an unsupported entry: $clamav_cert_entry" >&2
                exit 1
              fi
              clamav_cert_bytes=$(stat -c '%s' "$clamav_cert_entry")
              clamav_certs_file_count=$((clamav_certs_file_count + 1))
              clamav_certs_total_bytes=$((clamav_certs_total_bytes + clamav_cert_bytes))
              if [ "$clamav_certs_file_count" -gt 64 ] || [ "$clamav_cert_bytes" -gt 8388608 ] || [ "$clamav_certs_total_bytes" -gt 16777216 ]; then
                echo "ClamAV CVD certificate tree exceeds its bounded attestation contract" >&2
                exit 1
              fi
              clamav_cert_relative=${clamav_cert_entry#"$clamav_certs_dir"/}
              clamav_cert_sha256=$(sha256sum "$clamav_cert_entry" | cut -d ' ' -f 1)
              printf '%s\0%s\0%s\0' "$clamav_cert_relative" "$clamav_cert_bytes" "$clamav_cert_sha256" >> "$clamav_certs_manifest"
            done < <(find -P "$clamav_certs_dir" -mindepth 1 -print0 | LC_ALL=C sort -z)
            if [ "$clamav_certs_file_count" -eq 0 ]; then
              echo "ClamAV CVD certificate directory contains no regular files" >&2
              exit 1
            fi
            clamav_certs_manifest_sha256=$(sha256sum "$clamav_certs_manifest" | cut -d ' ' -f 1)
            export CVD_CERTS_DIR="$clamav_certs_dir"
            test -x "$clamav_prefix/bin/clamscan"
            test -x "$clamav_prefix/bin/freshclam"
            ln -s "$clamav_prefix/bin/clamscan" "$native_bin/clamscan"
            ln -s "$clamav_prefix/bin/freshclam" "$native_bin/freshclam"
            managed_appsec_bin="$APPSEC_PROOF_ROOT/runtime/tools/appsec/bin"
            mkdir -p "$managed_appsec_bin"
            ln -s "$clamav_prefix/bin/clamscan" "$managed_appsec_bin/clamscan"
            ln -s "$clamav_prefix/bin/freshclam" "$managed_appsec_bin/freshclam"
            clamav_library_path="$clamav_prefix/lib"
            freshclam_probe_root="$APPSEC_PROOF_ROOT/runtime/tools/appsec/clamav-version-probe"
            freshclam_probe_database="$freshclam_probe_root/database"
            freshclam_probe_config="$freshclam_probe_root/freshclam.conf"
            mkdir -p "$freshclam_probe_database"
            printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\nTestDatabases yes\n' \
              "$freshclam_probe_database" > "$freshclam_probe_config"
            chmod 600 "$freshclam_probe_config"
            freshclam_config_arg="--config-file=$freshclam_probe_config"
            freshclam_version_stderr="$freshclam_probe_root/version-probe.stderr"
            set +e
            freshclam_version=$(LD_LIBRARY_PATH="$clamav_library_path" \
              "$native_bin/freshclam" "$freshclam_config_arg" --cvdcertsdir "$clamav_certs_dir" --version \
              2>"$freshclam_version_stderr")
            freshclam_version_exit=$?
            set -e
            freshclam_version_stderr_tail=$(tail -n 8 "$freshclam_version_stderr" | tr '\r\n' '  ' | cut -c1-1000)
            rm -f "$freshclam_version_stderr"
            if [ "$freshclam_version_exit" -ne 0 ] || [ "$freshclam_version" != "ClamAV 1.5.4" ]; then
              printf 'FreshClam version probe failed: phase=freshclam-version-probe exit_code=%s observed_version=%s stderr_tail=%s\n' \
                "$freshclam_version_exit" "$freshclam_version" "$freshclam_version_stderr_tail" >&2
              exit 1
            fi
            LD_LIBRARY_PATH="$clamav_library_path" "$native_bin/clamscan" --cvdcertsdir "$clamav_certs_dir" --version | grep -E '^ClamAV 1\.5\.4(/|$)'
            {
              echo "LD_LIBRARY_PATH=$clamav_library_path${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              echo "CVD_CERTS_DIR=$clamav_certs_dir"
            } >> "$GITHUB_ENV"
            mkdir -p "$APPSEC_PROOF_ROOT"
            jq -n \
              --arg source_url "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.linux.${clamav_platform}.deb" \
              --arg archive_sha256 "$clamav_sha256" \
              --arg freshclam_path "$(realpath "$managed_appsec_bin/freshclam")" \
              --arg freshclam_sha256 "$(sha256sum "$managed_appsec_bin/freshclam" | cut -d ' ' -f 1)" \
              --arg freshclam_version "$freshclam_version" \
              --arg clamscan_path "$(realpath "$managed_appsec_bin/clamscan")" \
              --arg certs_path "$clamav_certs_dir" \
              --arg certs_manifest_sha256 "$clamav_certs_manifest_sha256" \
              --argjson certs_file_count "$clamav_certs_file_count" \
              --argjson certs_total_bytes "$clamav_certs_total_bytes" \
              '{version:"ctox.appsec.clamav_native_provenance.v1",ok:true,scope:"ephemeral-ci-proof-only",source_url:$source_url,archive_sha256:$archive_sha256,required_version:"1.5.4",freshclam:{canonical_path:$freshclam_path,sha256:$freshclam_sha256,version:$freshclam_version},clamscan:{canonical_path:$clamscan_path},cvd_certificate_directory:{version:"ctox.appsec.clamav_cvd_certificate_attestation.v1",canonical_path:$certs_path,manifest_sha256:$certs_manifest_sha256,file_count:$certs_file_count,total_bytes:$certs_total_bytes,source:"same-checksum-verified-distribution",environment_variable:"CVD_CERTS_DIR",verifier_bypass_allowed:false},managed_bin_staged:true,path_fallback_allowed:false,host_package_mutated:false,apparmor_mutated:false}' \
              > "$APPSEC_PROOF_ROOT/clamav-native-provenance.json"
          fi

          testssl_src="$native_src/testssl.sh"
          git init "$testssl_src"
          git -C "$testssl_src" remote add origin https://github.com/testssl/testssl.sh.git
          git -C "$testssl_src" fetch --depth 1 origin 97763a411c525720a5f9bd9d2cded416b10f210a
          git -C "$testssl_src" checkout --detach 97763a411c525720a5f9bd9d2cded416b10f210a
          test "$(git -C "$testssl_src" rev-parse HEAD)" = "97763a411c525720a5f9bd9d2cded416b10f210a"
          ln -s "$testssl_src/testssl.sh" "$native_bin/testssl.sh"
          echo "$native_bin" >> "$GITHUB_PATH"

      - name: Install macOS native AppSec packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew list nmap >/dev/null 2>&1 || brew install nmap

          native_bin="$RUNNER_TEMP/appsec-native/bin"
          native_src="$RUNNER_TEMP/appsec-native/src"
          mkdir -p "$native_bin" "$native_src"
          case "$(uname -m)" in
            arm64|aarch64)
              dalfox_platform="macos-aarch64"
              dalfox_sha256="37375c9c9bcc3c04b57ae53b5b8b4a2a334c456512f9e4e30e8acc992444ffe9"
              ;;
            x86_64)
              dalfox_platform="macos-x86_64"
              dalfox_sha256="f2646f9d6cb79d2026f153d6a8a08b09f19f49d96de520cad2a7e15c37515270"
              ;;
            *)
              echo "Unsupported macOS architecture for Dalfox: $(uname -m)" >&2
              exit 1
              ;;
          esac
          dalfox_archive="$RUNNER_TEMP/dalfox-v3.1.2-${dalfox_platform}.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/hahwul/dalfox/releases/download/v3.1.2/dalfox-v3.1.2-${dalfox_platform}.tar.gz" \
            --output "$dalfox_archive"
          printf '%s  %s\n' "$dalfox_sha256" "$dalfox_archive" | shasum -a 256 --check
          tar -xzf "$dalfox_archive" -C "$native_src"
          install -m 0755 "$native_src/dalfox-v3.1.2-${dalfox_platform}/dalfox" "$native_bin/dalfox"

          if [ "$APPSEC_PROFILE" = "full" ]; then
            clamav_package="$RUNNER_TEMP/clamav-1.5.4.macos.universal.pkg"
            curl --fail --location --silent --show-error \
              "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.macos.universal.pkg" \
              --output "$clamav_package"
            printf '%s  %s\n' "df7fa753e2f9f67f3bc99b2a40a3be7ef559088c68ad6bdf66b4b5764e965bd6" "$clamav_package" | shasum -a 256 --check
            clamav_signature=$(pkgutil --check-signature "$clamav_package")
            printf '%s\n' "$clamav_signature" | grep -F 'Status: signed by a developer certificate issued by Apple for distribution'
            printf '%s\n' "$clamav_signature" | grep -F 'Developer ID Installer: Cisco (DE8Y96K9QP)'
            clamav_notarization_log="$RUNNER_TEMP/clamav-1.5.4-notarization.log"
            set +e
            spctl --assess --type install --verbose=4 "$clamav_package" \
              >"$clamav_notarization_log" 2>&1
            clamav_notarization_exit=$?
            set -e
            clamav_notarization_tail=$(tail -n 8 "$clamav_notarization_log" | tr '\r\n' '  ' | cut -c1-1000)
            rm -f "$clamav_notarization_log"
            if [ "$clamav_notarization_exit" -ne 0 ]; then
              printf 'ClamAV package notarization failed: phase=macos-gatekeeper-assessment exit_code=%s output_tail=%s\n' \
                "$clamav_notarization_exit" "$clamav_notarization_tail" >&2
              exit 1
            fi
            sudo installer -pkg "$clamav_package" -target /
            clamav_prefix="/usr/local/clamav"
            if [ ! -d "$clamav_prefix/etc/certs" ] || [ -L "$clamav_prefix/etc/certs" ]; then
              echo "ClamAV CVD certificate directory is missing or is a symlink" >&2
              exit 1
            fi
            clamav_distribution_root=$(realpath "$clamav_prefix")
            clamav_certs_dir=$(realpath "$clamav_prefix/etc/certs")
            if [ "$clamav_certs_dir" != "$clamav_distribution_root/etc/certs" ] || [ ! -d "$clamav_certs_dir" ]; then
              echo "ClamAV CVD certificate directory is missing or escaped its signed distribution" >&2
              exit 1
            fi
            clamav_certs_manifest="$RUNNER_TEMP/clamav-1.5.4-certs.manifest"
            : > "$clamav_certs_manifest"
            clamav_certs_file_count=0
            clamav_certs_total_bytes=0
            while IFS= read -r -d '' clamav_cert_entry; do
              if [ -L "$clamav_cert_entry" ]; then
                echo "ClamAV CVD certificate tree contains a symlink: $clamav_cert_entry" >&2
                exit 1
              fi
              if [ -d "$clamav_cert_entry" ]; then
                continue
              fi
              if [ ! -f "$clamav_cert_entry" ]; then
                echo "ClamAV CVD certificate tree contains an unsupported entry: $clamav_cert_entry" >&2
                exit 1
              fi
              clamav_cert_bytes=$(stat -f '%z' "$clamav_cert_entry")
              clamav_certs_file_count=$((clamav_certs_file_count + 1))
              clamav_certs_total_bytes=$((clamav_certs_total_bytes + clamav_cert_bytes))
              if [ "$clamav_certs_file_count" -gt 64 ] || [ "$clamav_cert_bytes" -gt 8388608 ] || [ "$clamav_certs_total_bytes" -gt 16777216 ]; then
                echo "ClamAV CVD certificate tree exceeds its bounded attestation contract" >&2
                exit 1
              fi
              clamav_cert_relative=${clamav_cert_entry#"$clamav_certs_dir"/}
              clamav_cert_sha256=$(shasum -a 256 "$clamav_cert_entry" | cut -d ' ' -f 1)
              printf '%s\0%s\0%s\0' "$clamav_cert_relative" "$clamav_cert_bytes" "$clamav_cert_sha256" >> "$clamav_certs_manifest"
            done < <(find -s "$clamav_certs_dir" -mindepth 1 -print0)
            if [ "$clamav_certs_file_count" -eq 0 ]; then
              echo "ClamAV CVD certificate directory contains no regular files" >&2
              exit 1
            fi
            clamav_certs_manifest_sha256=$(shasum -a 256 "$clamav_certs_manifest" | cut -d ' ' -f 1)
            export CVD_CERTS_DIR="$clamav_certs_dir"
            test -x "$clamav_prefix/bin/clamscan"
            test -x "$clamav_prefix/bin/freshclam"
            codesign --verify --strict "$clamav_prefix/bin/clamscan"
            codesign --verify --strict "$clamav_prefix/bin/freshclam"
            managed_appsec_bin="$APPSEC_PROOF_ROOT/runtime/tools/appsec/bin"
            mkdir -p "$managed_appsec_bin"
            ln -s "$clamav_prefix/bin/clamscan" "$managed_appsec_bin/clamscan"
            ln -s "$clamav_prefix/bin/freshclam" "$managed_appsec_bin/freshclam"
            freshclam_probe_root="$APPSEC_PROOF_ROOT/runtime/tools/appsec/clamav-version-probe"
            freshclam_probe_database="$freshclam_probe_root/database"
            freshclam_probe_config="$freshclam_probe_root/freshclam.conf"
            mkdir -p "$freshclam_probe_database"
            printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\nTestDatabases yes\n' \
              "$freshclam_probe_database" > "$freshclam_probe_config"
            chmod 600 "$freshclam_probe_config"
            freshclam_config_arg="--config-file=$freshclam_probe_config"
            freshclam_version_stderr="$freshclam_probe_root/version-probe.stderr"
            set +e
            freshclam_version=$("$managed_appsec_bin/freshclam" \
              "$freshclam_config_arg" --cvdcertsdir "$clamav_certs_dir" --version 2>"$freshclam_version_stderr")
            freshclam_version_exit=$?
            set -e
            freshclam_version_stderr_tail=$(tail -n 8 "$freshclam_version_stderr" | tr '\r\n' '  ' | cut -c1-1000)
            rm -f "$freshclam_version_stderr"
            if [ "$freshclam_version_exit" -ne 0 ] || [ "$freshclam_version" != "ClamAV 1.5.4" ]; then
              printf 'FreshClam version probe failed: phase=freshclam-version-probe exit_code=%s observed_version=%s stderr_tail=%s\n' \
                "$freshclam_version_exit" "$freshclam_version" "$freshclam_version_stderr_tail" >&2
              exit 1
            fi
            "$managed_appsec_bin/clamscan" --cvdcertsdir "$clamav_certs_dir" --version | grep -E '^ClamAV 1\.5\.4(/|$)'
            echo "CVD_CERTS_DIR=$clamav_certs_dir" >> "$GITHUB_ENV"
            mkdir -p "$APPSEC_PROOF_ROOT"
            jq -n \
              --arg source_url "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.macos.universal.pkg" \
              --arg archive_sha256 "df7fa753e2f9f67f3bc99b2a40a3be7ef559088c68ad6bdf66b4b5764e965bd6" \
              --arg installer_identity "Developer ID Installer: Cisco (DE8Y96K9QP)" \
              --arg freshclam_path "$(realpath "$managed_appsec_bin/freshclam")" \
              --arg freshclam_sha256 "$(shasum -a 256 "$managed_appsec_bin/freshclam" | cut -d ' ' -f 1)" \
              --arg freshclam_version "$freshclam_version" \
              --arg clamscan_path "$(realpath "$managed_appsec_bin/clamscan")" \
              --arg certs_path "$clamav_certs_dir" \
              --arg certs_manifest_sha256 "$clamav_certs_manifest_sha256" \
              --argjson certs_file_count "$clamav_certs_file_count" \
              --argjson certs_total_bytes "$clamav_certs_total_bytes" \
              '{version:"ctox.appsec.clamav_native_provenance.v1",ok:true,scope:"ephemeral-ci-proof-only",source_url:$source_url,archive_sha256:$archive_sha256,required_version:"1.5.4",installer_identity:$installer_identity,apple_notarization_verified:true,freshclam:{canonical_path:$freshclam_path,sha256:$freshclam_sha256,version:$freshclam_version},clamscan:{canonical_path:$clamscan_path},cvd_certificate_directory:{version:"ctox.appsec.clamav_cvd_certificate_attestation.v1",canonical_path:$certs_path,manifest_sha256:$certs_manifest_sha256,file_count:$certs_file_count,total_bytes:$certs_total_bytes,source:"same-signed-checksum-verified-distribution",environment_variable:"CVD_CERTS_DIR",verifier_bypass_allowed:false},managed_bin_staged:true,path_fallback_allowed:false}' \
              > "$APPSEC_PROOF_ROOT/clamav-native-provenance.json"
          fi

          testssl_src="$native_src/testssl.sh"
          git init "$testssl_src"
          git -C "$testssl_src" remote add origin https://github.com/testssl/testssl.sh.git
          git -C "$testssl_src" fetch --depth 1 origin 97763a411c525720a5f9bd9d2cded416b10f210a
          git -C "$testssl_src" checkout --detach 97763a411c525720a5f9bd9d2cded416b10f210a
          test "$(git -C "$testssl_src" rev-parse HEAD)" = "97763a411c525720a5f9bd9d2cded416b10f210a"
          ln -s "$testssl_src/testssl.sh" "$native_bin/testssl.sh"
          echo "$native_bin" >> "$GITHUB_PATH"

      - name: Install Windows native AppSec packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nmap -y --no-progress
          $candidates = @(
            "${env:ProgramFiles(x86)}\Nmap",
            "${env:ProgramFiles}\Nmap"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
            }
          }

          $nativeRoot = Join-Path $env:RUNNER_TEMP "appsec-native"
          $nativeBin = Join-Path $nativeRoot "bin"
          $nativeSrc = Join-Path $nativeRoot "src"
          New-Item -ItemType Directory -Force -Path $nativeBin, $nativeSrc | Out-Null

          if ($env:APPSEC_PROFILE -eq "full") {
            $clamavArchive = Join-Path $env:RUNNER_TEMP "clamav-1.5.4.win.x64.zip"
            Invoke-WebRequest -Uri "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.win.x64.zip" -OutFile $clamavArchive
            $clamavArchiveDigest = (Get-FileHash -Algorithm SHA256 $clamavArchive).Hash.ToLowerInvariant()
            if ($clamavArchiveDigest -ne "0d9e0228b2674137ea1a2853566c98a0278ad52ab2582c3d6dbd75373848c395") {
              throw "ClamAV archive checksum mismatch: $clamavArchiveDigest"
            }
            $clamavExtract = Join-Path $nativeSrc "clamav-1.5.4"
            Expand-Archive -Path $clamavArchive -DestinationPath $clamavExtract -Force
            $clamavSource = Get-ChildItem -Path $clamavExtract -Recurse -File -Filter "clamscan.exe" | Select-Object -First 1
            if ($null -eq $clamavSource) {
              throw "Official ClamAV archive did not contain clamscan.exe"
            }
            $clamavDistribution = $clamavSource.Directory.FullName
            $freshclamSource = Join-Path $clamavDistribution "freshclam.exe"
            if (-not (Test-Path -PathType Leaf $freshclamSource)) {
              throw "Official ClamAV archive did not place freshclam.exe beside clamscan.exe"
            }
            $managedAppsecBin = Join-Path $env:APPSEC_PROOF_ROOT "runtime/tools/appsec/bin"
            New-Item -ItemType Directory -Force -Path $managedAppsecBin | Out-Null
            Copy-Item -Path (Join-Path $clamavDistribution "*") -Destination $managedAppsecBin -Recurse -Force
            $managedClamscan = Join-Path $managedAppsecBin "clamscan.exe"
            $managedFreshclam = Join-Path $managedAppsecBin "freshclam.exe"
            $managedClamavRoot = [IO.Path]::GetFullPath($managedAppsecBin).TrimEnd('\')
            $clamavCertsCandidate = Join-Path $managedAppsecBin "certs"
            if (-not (Test-Path -PathType Container $clamavCertsCandidate)) {
              throw "ClamAV CVD certificate directory is missing from the checksum-verified distribution"
            }
            $clamavCertsItem = Get-Item -LiteralPath $clamavCertsCandidate -Force
            if (($clamavCertsItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "ClamAV CVD certificate directory must not be a reparse point"
            }
            $clamavCertsDirectory = (Resolve-Path -LiteralPath $clamavCertsCandidate).ProviderPath
            if ($clamavCertsDirectory -ne (Join-Path $managedClamavRoot "certs")) {
              throw "ClamAV CVD certificate directory escaped its checksum-verified distribution: $clamavCertsDirectory"
            }
            $clamavCertEntries = @(Get-ChildItem -LiteralPath $clamavCertsDirectory -Recurse -Force | Sort-Object FullName)
            $clamavCertManifestLines = @()
            $clamavCertFileCount = 0
            [Int64]$clamavCertTotalBytes = 0
            foreach ($clamavCertEntry in $clamavCertEntries) {
              if (($clamavCertEntry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "ClamAV CVD certificate tree contains a reparse point: $($clamavCertEntry.FullName)"
              }
              if ($clamavCertEntry.PSIsContainer) {
                continue
              }
              $clamavCertFileCount += 1
              $clamavCertTotalBytes += $clamavCertEntry.Length
              if ($clamavCertFileCount -gt 64 -or $clamavCertEntry.Length -gt 8388608 -or $clamavCertTotalBytes -gt 16777216) {
                throw "ClamAV CVD certificate tree exceeds its bounded attestation contract"
              }
              $clamavCertRelative = [IO.Path]::GetRelativePath($clamavCertsDirectory, $clamavCertEntry.FullName).Replace('\', '/')
              $clamavCertSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $clamavCertEntry.FullName).Hash.ToLowerInvariant()
              $clamavCertManifestLines += "$clamavCertRelative`0$($clamavCertEntry.Length)`0$clamavCertSha256`0"
            }
            if ($clamavCertFileCount -eq 0) {
              throw "ClamAV CVD certificate directory contains no regular files"
            }
            $clamavCertManifestBytes = [Text.Encoding]::UTF8.GetBytes(($clamavCertManifestLines -join ''))
            $clamavCertManifestHasher = [Security.Cryptography.SHA256]::Create()
            try {
              $clamavCertManifestSha256 = ([BitConverter]::ToString($clamavCertManifestHasher.ComputeHash($clamavCertManifestBytes))).Replace('-', '').ToLowerInvariant()
            } finally {
              $clamavCertManifestHasher.Dispose()
            }
            $env:CVD_CERTS_DIR = $clamavCertsDirectory
            Add-Content -Path $env:GITHUB_ENV -Value "CVD_CERTS_DIR=$clamavCertsDirectory"
            $freshclamProbeRoot = Join-Path $env:APPSEC_PROOF_ROOT "runtime/tools/appsec/clamav-version-probe"
            $freshclamProbeDatabase = Join-Path $freshclamProbeRoot "database"
            $freshclamProbeConfig = Join-Path $freshclamProbeRoot "freshclam.conf"
            New-Item -ItemType Directory -Force -Path $freshclamProbeDatabase | Out-Null
            $freshclamProbeDatabaseForConfig = $freshclamProbeDatabase.Replace('\', '/')
            @(
              "DatabaseDirectory $freshclamProbeDatabaseForConfig"
              "DatabaseMirror database.clamav.net"
              "TestDatabases yes"
            ) | Set-Content -Path $freshclamProbeConfig -Encoding ascii
            $freshclamConfigArg = "--config-file=$freshclamProbeConfig"
            $freshclamVersionStderr = Join-Path $freshclamProbeRoot "version-probe.stderr"
            $freshclamVersionOutput = @(& $managedFreshclam $freshclamConfigArg --cvdcertsdir $clamavCertsDirectory --version 2> $freshclamVersionStderr)
            $freshclamVersionExit = $LASTEXITCODE
            $freshclamVersion = ($freshclamVersionOutput | Out-String).Trim()
            $freshclamVersionStderrTail = ((Get-Content -Path $freshclamVersionStderr -Tail 8 -ErrorAction SilentlyContinue | Out-String).Trim() -replace '[\r\n]+', ' | ')
            Remove-Item -Force -ErrorAction SilentlyContinue $freshclamVersionStderr
            if ($freshclamVersionStderrTail.Length -gt 1000) {
              $freshclamVersionStderrTail = $freshclamVersionStderrTail.Substring(0, 1000)
            }
            if ($freshclamVersionExit -ne 0 -or $freshclamVersion -ne "ClamAV 1.5.4") {
              throw "FreshClam version probe failed: phase=freshclam-version-probe exit_code=$freshclamVersionExit observed_version=$freshclamVersion stderr_tail=$freshclamVersionStderrTail"
            }
            $clamscanVersion = (& $managedClamscan --cvdcertsdir $clamavCertsDirectory --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $clamscanVersion -notmatch '^ClamAV 1\.5\.4(/|$)') {
              throw "Official clamscan did not report exact version 1.5.4: $clamscanVersion"
            }
            New-Item -ItemType Directory -Force -Path $env:APPSEC_PROOF_ROOT | Out-Null
            [ordered]@{
              version = "ctox.appsec.clamav_native_provenance.v1"
              ok = $true
              scope = "ephemeral-ci-proof-only"
              source_url = "https://github.com/Cisco-Talos/clamav/releases/download/clamav-1.5.4/clamav-1.5.4.win.x64.zip"
              archive_sha256 = $clamavArchiveDigest
              required_version = "1.5.4"
              freshclam = [ordered]@{
                canonical_path = [IO.Path]::GetFullPath($managedFreshclam)
                sha256 = (Get-FileHash -Algorithm SHA256 $managedFreshclam).Hash.ToLowerInvariant()
                version = $freshclamVersion
              }
              clamscan = [ordered]@{
                canonical_path = [IO.Path]::GetFullPath($managedClamscan)
                sha256 = (Get-FileHash -Algorithm SHA256 $managedClamscan).Hash.ToLowerInvariant()
                version = $clamscanVersion
              }
              cvd_certificate_directory = [ordered]@{
                version = "ctox.appsec.clamav_cvd_certificate_attestation.v1"
                canonical_path = $clamavCertsDirectory
                manifest_sha256 = $clamavCertManifestSha256
                file_count = $clamavCertFileCount
                total_bytes = $clamavCertTotalBytes
                source = "same-checksum-verified-distribution"
                environment_variable = "CVD_CERTS_DIR"
                verifier_bypass_allowed = $false
              }
              managed_bin_staged = $true
              path_fallback_allowed = $false
              host_package_mutated = $false
            } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $env:APPSEC_PROOF_ROOT "clamav-native-provenance.json")
            Add-Content -Path $env:GITHUB_PATH -Value $managedAppsecBin
          }

          $dalfoxArchive = Join-Path $env:RUNNER_TEMP "dalfox-v3.1.2-windows-x86_64.zip"
          Invoke-WebRequest -Uri "https://github.com/hahwul/dalfox/releases/download/v3.1.2/dalfox-v3.1.2-windows-x86_64.zip" -OutFile $dalfoxArchive
          $dalfoxDigest = (Get-FileHash -Algorithm SHA256 $dalfoxArchive).Hash.ToLowerInvariant()
          if ($dalfoxDigest -ne "9aac0bb85fec8710ba23f1df96de34217931dee81693503ebcf61150c4368300") {
            throw "Dalfox archive checksum mismatch: $dalfoxDigest"
          }
          Expand-Archive -Path $dalfoxArchive -DestinationPath $nativeSrc -Force
          Copy-Item (Join-Path $nativeSrc "dalfox-v3.1.2-windows-x86_64/dalfox.exe") (Join-Path $nativeBin "dalfox.exe")

          $testsslSrc = Join-Path $nativeSrc "testssl.sh"
          git init $testsslSrc
          git -C $testsslSrc remote add origin https://github.com/testssl/testssl.sh.git
          git -C $testsslSrc fetch --depth 1 origin 97763a411c525720a5f9bd9d2cded416b10f210a
          git -C $testsslSrc checkout --detach 97763a411c525720a5f9bd9d2cded416b10f210a
          if ((git -C $testsslSrc rev-parse HEAD).Trim() -ne "97763a411c525720a5f9bd9d2cded416b10f210a") {
            throw "testssl.sh checkout does not match the reviewed commit"
          }
          $gitBash = Join-Path $env:ProgramFiles "Git/bin/bash.exe"
          if (-not (Test-Path $gitBash)) {
            throw "Git Bash is required for the pinned testssl.sh runtime"
          }
          $testsslLauncher = Join-Path $nativeBin "testssl.cmd"
          @"
          @echo off
          set "PATH=$nativeBin;%PATH%"
          "$gitBash" "$testsslSrc\testssl.sh" %*
          "@ | Set-Content -Encoding Ascii $testsslLauncher
          Add-Content -Path $env:GITHUB_PATH -Value $nativeBin

      - name: Build focused deployment audit CLIs
        run: |
          cargo build --locked --manifest-path src/tools/appsec-pentest/Cargo.toml
          cargo build --locked --manifest-path src/tools/web-stack/Cargo.toml --no-default-features --bin ctox-web-stack

      - name: Stage reviewed Windows testssl hexdump adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test --locked --manifest-path src/tools/appsec-pentest/Cargo.toml --features ci-testssl-hexdump --bin ctox-appsec-hexdump
          cargo build --locked --manifest-path src/tools/appsec-pentest/Cargo.toml --features ci-testssl-hexdump --bin ctox-appsec-hexdump
          $nativeBin = Join-Path $env:RUNNER_TEMP "appsec-native/bin"
          $hexdump = Join-Path $nativeBin "hexdump.exe"
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "debug/ctox-appsec-hexdump.exe") $hexdump

          # This adapter is built from the reviewed checkout with the pinned
          # Rust toolchain. It exists only in RUNNER_TEMP for this proof and is
          # never installed into CTOX's managed product/runtime tool root.
          $fixture = Join-Path $env:RUNNER_TEMP "appsec-native/hexdump-selftest.bin"
          [IO.File]::WriteAllBytes($fixture, [Text.Encoding]::ASCII.GetBytes("CTOX"))
          $compactUpper = (& $hexdump -v -e '16/1 "%02X"' $fixture | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compactUpper -ne "43544F58") {
            throw "Reviewed hexdump adapter failed the uppercase compact-format proof"
          }
          $compactLower = (& $hexdump -v -e '16/1 "%02x"' $fixture | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compactLower -ne "43544f58") {
            throw "Reviewed hexdump adapter failed the lowercase compact-format proof"
          }
          $commaLower = (& $hexdump -v -e '4/1 "%02x,"' $fixture | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $commaLower -ne "43,54,4f,58,") {
            throw "Reviewed hexdump adapter failed the comma-format proof"
          }
          $spacedLower = (& $hexdump -ve '2/1 "%02x " " \n"' $fixture | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $spacedLower -notmatch '43 54\s+4f 58') {
            throw "Reviewed hexdump adapter failed the spaced-line-format proof"
          }
          $canonical = (& $hexdump -C $fixture | Out-String)
          if ($LASTEXITCODE -ne 0 -or $canonical -notmatch "43 54 4f 58" -or $canonical -notmatch "CTOX") {
            throw "Reviewed hexdump adapter failed the canonical-format proof"
          }
          & $hexdump -e '16/1 "%03x"' $fixture 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Reviewed hexdump adapter accepted a format outside the testssl allowlist"
          }
          $testsslLauncher = Join-Path $nativeBin "testssl.cmd"
          $testsslVersion = (& $testsslLauncher --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $testsslVersion -notmatch 'testssl\.sh' -or $testsslVersion -notmatch '3\.2\.4') {
            throw "Pinned testssl.sh did not pass its real Windows version probe"
          }

          New-Item -ItemType Directory -Force -Path $env:APPSEC_PROOF_ROOT | Out-Null
          [ordered]@{
            version = "ctox.appsec.windows_hexdump_provenance.v2"
            ok = $true
            scope = "ephemeral-ci-proof-only"
            source_repository = $env:GITHUB_REPOSITORY
            source_commit = $env:GITHUB_SHA
            source_path = "src/tools/appsec-pentest/src/bin/ctox-appsec-hexdump.rs"
            source_sha256 = (Get-FileHash -Algorithm SHA256 "src/tools/appsec-pentest/src/bin/ctox-appsec-hexdump.rs").Hash.ToLowerInvariant()
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $hexdump).Hash.ToLowerInvariant()
            reviewed_testssl_commit = "97763a411c525720a5f9bd9d2cded416b10f210a"
            supported_formats = @("-C", 'N/1 "%02X"', 'N/1 "%02x"', 'N/1 "%02x,"', 'N/1 "%02x " " \n"')
            compact_upper_proof = $compactUpper
            compact_lower_proof = $compactLower
            comma_lower_proof = $commaLower
            spaced_lower_proof = $true
            canonical_proof = $true
            rejects_unreviewed_formats = $true
            testssl_version_proof = $true
          } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:APPSEC_PROOF_ROOT "windows-hexdump-provenance.json")

      - name: Run AppSec toolchain proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APPSEC_PROOF_ROOT/runtime/appsec/default"
          APPSEC_BIN="$CARGO_TARGET_DIR/debug/pentest"
          if [ "$RUNNER_OS" = "Windows" ]; then
            APPSEC_BIN="$CARGO_TARGET_DIR/debug/pentest.exe"
          fi
          args=(
            tools
            proof-run
            --state-dir
            "$APPSEC_PROOF_ROOT/runtime/appsec/default"
            --tools-root
            "$APPSEC_PROOF_ROOT/runtime/tools/appsec"
            --profile
            "$APPSEC_PROFILE"
            --install-missing
            --probe-versions
            --smoke-timeout
            "$APPSEC_SMOKE_TIMEOUT_SECONDS"
          )
          if [ "$APPSEC_INCLUDE_DATA_BUNDLES" != "true" ]; then
            args+=(--skip-data)
          fi
          if [ "$APPSEC_ATTEST_NATIVE" = "true" ]; then
            args+=(--attest-current-native --reviewed-by "github-actions:${RUNNER_OS}")
          fi
          "$APPSEC_BIN" "${args[@]}" --json | tee "$APPSEC_PROOF_ROOT/proof-run-output.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = path.join(process.env.APPSEC_PROOF_ROOT, 'proof-run-output.json');
          const payload = JSON.parse(fs.readFileSync(out, 'utf8'));
          const proof = payload.proof_run || {};
          if (payload.ok !== true || proof.ready !== true) {
            console.error('AppSec toolchain proof is not ready.');
            console.error(JSON.stringify({
              ok: payload.ok,
              ready: proof.ready,
              summary: proof.summary || null,
            }, null, 2));
            process.exit(1);
          }
          NODE

      - name: Prove CTOX web-stack browser runtime
        shell: bash
        run: |
          set -euo pipefail
          WEB_BIN="$CARGO_TARGET_DIR/debug/ctox-web-stack"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WEB_BIN="$CARGO_TARGET_DIR/debug/ctox-web-stack.exe"
          fi
          BROWSER_DIR="$APPSEC_PROOF_ROOT/runtime/browser/reference"
          "$WEB_BIN" --root "$APPSEC_PROOF_ROOT" browser-prepare \
            --dir "$BROWSER_DIR" \
            --install-reference \
            --install-browser \
            | tee "$APPSEC_PROOF_ROOT/browser-prepare.json"
          "$WEB_BIN" --root "$APPSEC_PROOF_ROOT" browser-automation \
            --dir "$BROWSER_DIR" \
            --script-file src/tools/appsec-pentest/fixtures/platform-browser-smoke.js \
            | tee "$APPSEC_PROOF_ROOT/browser-automation.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.APPSEC_PROOF_ROOT;
          const prepare = JSON.parse(fs.readFileSync(path.join(root, 'browser-prepare.json'), 'utf8'));
          const automation = JSON.parse(fs.readFileSync(path.join(root, 'browser-automation.json'), 'utf8'));
          if (prepare?.doctor?.automation_ready !== true || prepare?.doctor?.smoke?.ok !== true) {
            throw new Error('CTOX web-stack browser doctor or smoke is not ready');
          }
          if (automation?.ok !== true || automation?.result?.ok !== true) {
            throw new Error('CTOX web-stack browser automation did not return a passing result');
          }
          NODE

      - name: Run retained deployment audit assessment
        shell: bash
        run: |
          set -euo pipefail
          APPSEC_BIN="$CARGO_TARGET_DIR/debug/pentest"
          if [ "$RUNNER_OS" = "Windows" ]; then
            APPSEC_BIN="$CARGO_TARGET_DIR/debug/pentest.exe"
          fi
          STATE_DIR="$APPSEC_PROOF_ROOT/runtime/appsec/platform-assessment"
          LAB_DIR="$APPSEC_PROOF_ROOT/lab"
          RETAINED_DIR="$APPSEC_PROOF_ROOT/retained-assessment"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" \
            lab create --out "$LAB_DIR" --json \
            | tee "$APPSEC_PROOF_ROOT/lab-create.json"
          python "$LAB_DIR/ctox-vulnerable-webapp.py" --host 127.0.0.1 --port 8766 \
            >"$APPSEC_PROOF_ROOT/lab-server.log" 2>&1 &
          LAB_PID=$!
          cleanup() {
            kill "$LAB_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          node -e "const http=require('http');let n=0;const ping=()=>http.get('http://127.0.0.1:8766/',r=>{r.resume();process.exit(0)}).on('error',()=>{if(++n>50)process.exit(1);setTimeout(ping,200)});ping()"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" lab run \
            --url http://127.0.0.1:8766 --profile full --json \
            | tee "$APPSEC_PROOF_ROOT/lab-run.json"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" artifact audit --json \
            | tee "$APPSEC_PROOF_ROOT/artifact-audit.json"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" report --format json \
            --out "$STATE_DIR/reports/deployment-audit-report.json" --json \
            | tee "$APPSEC_PROOF_ROOT/report.json"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" artifact export \
            --out "$RETAINED_DIR" --json \
            | tee "$APPSEC_PROOF_ROOT/export.json"
          "$APPSEC_BIN" --state-dir "$STATE_DIR" \
            --tools-root "$APPSEC_PROOF_ROOT/runtime/tools/appsec" artifact verify-export \
            --dir "$RETAINED_DIR" --json \
            | tee "$APPSEC_PROOF_ROOT/verify-export.json"

      - name: Validate platform acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.APPSEC_PROOF_ROOT;
          const read = name => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
          const proof = read('proof-run-output.json');
          const browserPrepare = read('browser-prepare.json');
          const browserAutomation = read('browser-automation.json');
          const lab = read('lab-run.json');
          const audit = read('artifact-audit.json');
          const report = read('report.json');
          const exported = read('export.json');
          const verified = read('verify-export.json');
          const hexdumpPath = path.join(root, 'windows-hexdump-provenance.json');
          const hexdump = process.env.RUNNER_OS === 'Windows'
            ? JSON.parse(fs.readFileSync(hexdumpPath, 'utf8'))
            : null;
          const inventoryPath = path.join(root, 'runtime', 'appsec', 'default', 'tool-inventory.json');
          const inventory = JSON.parse(fs.readFileSync(inventoryPath, 'utf8'));
          const requiredTools = (inventory.tools || []).filter(tool =>
            ['httpx', 'katana', 'nuclei'].includes(tool.name));
          const zap = (inventory.tools || []).find(tool => tool.name === 'zaproxy');
          const requiredDataBundles = (inventory.data_bundles || []).filter(bundle =>
            bundle.profile === 'minimal');
          const acceptance = {
            version: 'ctox.deployment_audit.platform_acceptance.v1',
            generated_at: new Date().toISOString(),
            platform: process.env.APPSEC_PLATFORM,
            runner_os: process.env.RUNNER_OS,
            profile: process.env.APPSEC_PROFILE,
            gates: {
              install_doctor_smoke: proof?.ok === true && proof?.proof_run?.ready === true,
              browser_doctor: browserPrepare?.doctor?.automation_ready === true && browserPrepare?.doctor?.smoke?.ok === true,
              browser_automation: browserAutomation?.ok === true && browserAutomation?.result?.ok === true,
              assessment: lab?.ok === true && lab?.scan_completed === true,
              artifact_audit: audit?.ok === true,
              report: report?.ok === true && report?.report_complete === true,
              retained_export: exported?.ok === true && verified?.ok === true,
              zap_nonblocking: zap?.default_enabled === false,
              windows_hexdump_attested: process.env.RUNNER_OS !== 'Windows'
                || (hexdump?.ok === true
                  && hexdump?.version === 'ctox.appsec.windows_hexdump_provenance.v2'
                  && hexdump?.scope === 'ephemeral-ci-proof-only'
                  && hexdump?.source_path === 'src/tools/appsec-pentest/src/bin/ctox-appsec-hexdump.rs'
                  && /^[a-f0-9]{64}$/.test(hexdump?.source_sha256 || '')
                  && /^[a-f0-9]{64}$/.test(hexdump?.executable_sha256 || '')
                  && hexdump?.reviewed_testssl_commit === '97763a411c525720a5f9bd9d2cded416b10f210a'
                  && hexdump?.compact_upper_proof === '43544F58'
                  && hexdump?.compact_lower_proof === '43544f58'
                  && hexdump?.comma_lower_proof === '43,54,4f,58,'
                  && hexdump?.spaced_lower_proof === true
                  && hexdump?.canonical_proof === true
                  && hexdump?.rejects_unreviewed_formats === true
                  && hexdump?.testssl_version_proof === true),
            },
            required_tools: requiredTools.map(tool => ({
              name: tool.name,
              available: tool.available,
              detected_version: tool.detected_version,
              pinned_version: tool.pinned_version,
              license: tool.license,
              checksum: tool.checksum,
              provenance: tool.provenance,
            })),
            required_data_bundles: requiredDataBundles,
          };
          acceptance.ok = Object.values(acceptance.gates).every(Boolean)
            && acceptance.required_tools.length === 3
            && acceptance.required_tools.every(tool =>
              tool.available === true
              && typeof tool.detected_version === 'string'
              && tool.detected_version.length > 0
              && typeof tool.pinned_version === 'string'
              && tool.pinned_version.length > 0
              && typeof tool.license === 'string'
              && tool.license.length > 0
              && tool.checksum?.algorithm === 'sha256'
              && /^[a-f0-9]{64}$/.test(tool.checksum?.value || ''))
            && acceptance.required_data_bundles.length > 0
            && acceptance.required_data_bundles.every(bundle => bundle.available === true);
          fs.writeFileSync(path.join(root, 'platform-acceptance.json'), `${JSON.stringify(acceptance, null, 2)}\n`);
          if (!acceptance.ok) {
            console.error(JSON.stringify(acceptance, null, 2));
            process.exit(1);
          }
          NODE

      - name: Summarize AppSec proof
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.APPSEC_PROOF_ROOT;
          const out = path.join(root, 'proof-run-output.json');
          const proofPath = path.join(root, 'runtime/tools/appsec/toolchain-proof-run.json');
          let payload = null;
          for (const candidate of [proofPath, out]) {
            if (!fs.existsSync(candidate)) continue;
            try {
              const parsed = JSON.parse(fs.readFileSync(candidate, 'utf8'));
              payload = parsed.proof_run || parsed;
              break;
            } catch (_) {}
          }
          const summary = payload?.summary || {};
          const lines = [
            `# Deployment audit platform proof`,
            ``,
            `ready: ${payload?.ready ?? 'unknown'}`,
            `profile: ${payload?.profile ?? process.env.APPSEC_PROFILE}`,
            `platform: ${payload?.platform?.os ?? process.platform}/${payload?.platform?.arch ?? process.arch}`,
            ``,
            `| Field | Value |`,
            `| --- | --- |`,
            `| required_tools | ${summary.required_tools ?? 'n/a'} |`,
            `| available_required_tools | ${summary.available_required_tools ?? 'n/a'} |`,
            `| missing_required_tools | ${summary.missing_required_tools ?? 'n/a'} |`,
            `| unverified_required_tools | ${summary.unverified_required_tools ?? 'n/a'} |`,
            `| missing_required_data_bundles | ${summary.missing_required_data_bundles ?? 'n/a'} |`,
            `| smoke_failed_or_unavailable | ${summary.smoke_failed_or_unavailable ?? 'n/a'} |`,
            ``,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE

      - name: Upload AppSec proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appsec-toolchain-proof-${{ runner.os }}-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/ctox-appsec-proof/proof-run-output.json
            ${{ runner.temp }}/ctox-appsec-proof/platform-acceptance.json
            ${{ runner.temp }}/ctox-appsec-proof/browser-prepare.json
            ${{ runner.temp }}/ctox-appsec-proof/browser-automation.json
            ${{ runner.temp }}/ctox-appsec-proof/lab-*.json
            ${{ runner.temp }}/ctox-appsec-proof/artifact-audit.json
            ${{ runner.temp }}/ctox-appsec-proof/report.json
            ${{ runner.temp }}/ctox-appsec-proof/export.json
            ${{ runner.temp }}/ctox-appsec-proof/verify-export.json
            ${{ runner.temp }}/ctox-appsec-proof/windows-hexdump-provenance.json
            ${{ runner.temp }}/ctox-appsec-proof/clamav-native-provenance.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/appsec/**/*.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/*.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/install-provenance/**
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/install-logs/**
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/templates/**/.ctox-data-bundle.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/wordlists/**/.ctox-data-bundle.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/trivy-cache/.ctox-data-bundle.json
            ${{ runner.temp }}/ctox-appsec-proof/runtime/tools/appsec/clamav/database/.ctox-data-bundle.json
            ${{ runner.temp }}/ctox-appsec-proof/retained-assessment/**
