name: Crew liveness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/business_os/harness_cockpit_chat*'
      - 'src/core/business_os/rxdb_peer*'
      - 'src/core/service/service_queue_capacity.rs'
      - 'src/core/mission/channels/command_saga.rs'
      - 'src/core/mission/channels/outbound_review.rs'
      - '.github/workflows/crew-liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crew-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: crew-liveness
          cache-on-failure: 'true'
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev sqlite3
          df -h /
      - name: Check and compile regression tests
        run: |
          cargo check --locked --bin ctox
          cargo test --locked --bin ctox --no-run
      - name: Admission and projection regressions
        run: |
          cargo test --locked --bin ctox queue_capacity_tests -- --test-threads=1
          cargo test --locked --bin ctox adapter_reconciliation -- --test-threads=1
          cargo test --locked --bin ctox business_os::harness_cockpit::chat::tests -- --test-threads=1
          cargo test --locked --bin ctox background_projection_releases_writer_between_pages -- --test-threads=1
          cargo test --locked --bin ctox sync_ticket_state -- --test-threads=1
          cargo test --locked --bin ctox sync_knowledge_tables -- --test-threads=1
      - name: Clippy
        run: cargo clippy --locked --bin ctox --tests
      - name: Native RxDB suite
        run: cargo test --locked --manifest-path src/core/rxdb/Cargo.toml -- --test-threads=1
      - name: Browser wire contract and JS suite
        run: |
          cargo build --locked --manifest-path src/core/rxdb/Cargo.toml --example v15_wire_daemon
          node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon --wire-daemon "$CARGO_TARGET_DIR/debug/examples/v15_wire_daemon"
