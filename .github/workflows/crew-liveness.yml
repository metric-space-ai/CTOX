name: Crew liveness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/business_os/harness_cockpit_chat*'
      - 'src/core/business_os/rxdb_peer*'
      - 'src/core/business_os/desktop_files.rs'
      - 'src/core/service/service_queue_capacity.rs'
      - 'src/core/mission/channels/command_saga.rs'
      - 'src/core/mission/channels/outbound_review.rs'
      - '.github/workflows/crew-liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant_candidate:
    if: ${{ github.head_ref == 'codex/peer-startup-liveness' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: peer-tenant-release
          cache-on-failure: 'true'
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev
          df -h /
      - name: Build release candidate
        run: |
          cargo build --release --locked --bin ctox
          mkdir -p "$RUNNER_TEMP/peer-release-candidate"
          cp "$CARGO_TARGET_DIR/release/ctox" "$RUNNER_TEMP/peer-release-candidate/ctox-real"
          git rev-parse HEAD > "$RUNNER_TEMP/peer-release-candidate/source-commit.txt"
          ldd "$CARGO_TARGET_DIR/release/ctox" > "$RUNNER_TEMP/peer-release-candidate/shared-libraries.txt"
          cd "$RUNNER_TEMP/peer-release-candidate"
          sha256sum ctox-real > SHA256SUMS
      - name: Retain release candidate for measured rollout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peer-startup-release-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/peer-release-candidate/
          retention-days: 7
          if-no-files-found: error

  regression:
    concurrency:
      group: crew-liveness-${{ github.ref }}
      # Preserve the active baseline run while the release candidate builds.
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: crew-liveness
          cache-on-failure: 'true'
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev sqlite3 ripgrep
          df -h /
      - name: Check and compile regression tests
        id: compile
        run: |
          cargo check --locked --bin ctox
          cargo test --locked --bin ctox --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/crew-head-tests.jsonl"
          CREW_TEST_BINARY=$(python3 -c '
          import json, sys
          rows = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          paths = {r["executable"] for r in rows if r.get("reason") == "compiler-artifact" and r.get("target", {}).get("name") == "ctox" and r.get("profile", {}).get("test") and r.get("executable")}
          assert len(paths) == 1, f"Expected exactly one CTOX test binary, found {paths}"
          print(paths.pop())
          ' "$RUNNER_TEMP/crew-head-tests.jsonl")
          echo "CREW_TEST_BINARY=$CREW_TEST_BINARY" >> "$GITHUB_ENV"
      - name: Admission and projection regressions
        run: |
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE"
          export LD_LIBRARY_PATH="$CARGO_TARGET_DIR/debug/deps:$(rustc --print target-libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          failed=0
          for filter in peer_startup rxdb_peer_projections::budget queue_capacity_tests crew:: queued_prompt adapter_reconciliation business_os::harness_cockpit::chat::tests background_projection_releases_writer_between_pages sync_business_record_projections sync_business_users sync_runtime_settings sync_channel_state sync_ticket_state sync_knowledge_tables; do
            "$CREW_TEST_BINARY" "$filter" --test-threads=1 || failed=1
          done
          exit "$failed"
      - name: Clippy
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: cargo clippy --locked --bin ctox --tests
      - name: Native RxDB suite
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: cargo test --locked --manifest-path src/core/rxdb/Cargo.toml -- --test-threads=1
      - name: Browser wire contract and JS suite
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: |
          cargo build --locked --manifest-path src/core/rxdb/Cargo.toml --example v15_wire_daemon
          mkdir -p runtime/build
          ln -s "$CARGO_TARGET_DIR" runtime/build/cargo-target
          npm ci --ignore-scripts --prefix src/apps/business-os
          npm audit --audit-level=low --prefix src/apps/business-os
          npm --prefix src/apps/business-os exec -- playwright install --with-deps chromium
          node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon
      - name: Build native peer candidate for tenant measurement
        id: peer_candidate
        if: ${{ always() && steps.compile.outcome == 'success' && github.head_ref == 'codex/peer-startup-liveness' }}
        run: |
          cargo build --locked --bin ctox
          mkdir -p "$RUNNER_TEMP/peer-candidate"
          cp "$CARGO_TARGET_DIR/debug/ctox" "$RUNNER_TEMP/peer-candidate/ctox-real"
          git rev-parse HEAD > "$RUNNER_TEMP/peer-candidate/source-commit.txt"
          ldd "$CARGO_TARGET_DIR/debug/ctox" > "$RUNNER_TEMP/peer-candidate/shared-libraries.txt"
          cd "$RUNNER_TEMP/peer-candidate"
          sha256sum ctox-real > SHA256SUMS
      - name: Retain native peer candidate
        if: ${{ always() && steps.peer_candidate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peer-startup-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/peer-candidate/
          retention-days: 7
      - name: Measure existing regression filters on campaign base
        if: ${{ always() && steps.compile.outcome == 'success' && (github.head_ref == 'codex/crew-open-items' || github.head_ref == 'codex/peer-startup-liveness') }}
        run: |
          CREW_TEST_HEAD=$(git rev-parse HEAD)
          trap 'git checkout --detach "$CREW_TEST_HEAD"' EXIT
          CREW_BASE_SHA=8e6f132a82549be9235dd433fc9bd28d5ae868e6
          if [ "$GITHUB_HEAD_REF" = "codex/peer-startup-liveness" ]; then
            CREW_BASE_SHA=ebe57e602976f5b79315e2e4941a1680081c9f66
          fi
          git fetch --no-tags origin "$CREW_BASE_SHA"
          git checkout --detach "$CREW_BASE_SHA"
          cargo test --locked --bin ctox --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/crew-base-tests.jsonl"
          CREW_BASE_TEST_BINARY=$(python3 -c '
          import json, sys
          rows = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          paths = {r["executable"] for r in rows if r.get("reason") == "compiler-artifact" and r.get("target", {}).get("name") == "ctox" and r.get("profile", {}).get("test") and r.get("executable")}
          assert len(paths) == 1, f"Expected exactly one CTOX test binary, found {paths}"
          print(paths.pop())
          ' "$RUNNER_TEMP/crew-base-tests.jsonl")
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE"
          export LD_LIBRARY_PATH="$CARGO_TARGET_DIR/debug/deps:$(rustc --print target-libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          failed=0
          for filter in crew:: queued_prompt adapter_reconciliation business_os::harness_cockpit::chat::tests sync_business_record_projections sync_business_users sync_runtime_settings sync_channel_state sync_ticket_state sync_knowledge_tables; do
            status=0
            "$CREW_BASE_TEST_BINARY" "$filter" --test-threads=1 || status=$?
            echo "Baseline $CREW_BASE_SHA: $filter exit=$status"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          status=0
          node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon || status=$?
          echo "Baseline $CREW_BASE_SHA: JS/wire exit=$status"
          if [ "$status" -ne 0 ]; then failed=1; fi
          exit "$failed"
