name: Crew liveness

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/business_os/harness_cockpit_chat*'
      - 'src/core/business_os/rxdb_peer*'
      - 'src/core/service/service_queue_capacity.rs'
      - 'src/core/mission/channels/command_saga.rs'
      - 'src/core/mission/channels/outbound_review.rs'
      - '.github/workflows/crew-liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crew-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: ./.github/actions/build-pi-sidecar
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: '1.93.0'
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: crew-liveness
          cache-on-failure: 'true'
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libfontconfig1-dev pkg-config libdbus-1-dev sqlite3
          df -h /
      - name: Check and compile regression tests
        id: compile
        run: |
          cargo check --locked --bin ctox
          cargo test --locked --bin ctox --no-run
      - name: Admission and projection regressions
        run: |
          failed=0
          for filter in queue_capacity_tests crew:: adapter_reconciliation business_os::harness_cockpit::chat::tests background_projection_releases_writer_between_pages sync_ticket_state sync_knowledge_tables; do
            cargo test --locked --bin ctox "$filter" -- --test-threads=1 || failed=1
          done
          exit "$failed"
      - name: Clippy
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: cargo clippy --locked --bin ctox --tests
      - name: Native RxDB suite
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: cargo test --locked --manifest-path src/core/rxdb/Cargo.toml -- --test-threads=1
      - name: Browser wire contract and JS suite
        if: ${{ always() && steps.compile.outcome == 'success' }}
        run: |
          cargo build --locked --manifest-path src/core/rxdb/Cargo.toml --example v15_wire_daemon
          node src/apps/business-os/rxdb/tests/run-all.mjs --require-wire-daemon --wire-daemon "$CARGO_TARGET_DIR/debug/examples/v15_wire_daemon"
      - name: Measure existing regression filters on campaign base
        if: ${{ always() && steps.compile.outcome == 'success' && github.head_ref == 'codex/crew-open-items' }}
        run: |
          CREW_TEST_HEAD=$(git rev-parse HEAD)
          trap 'git checkout --detach "$CREW_TEST_HEAD"' EXIT
          git fetch --no-tags origin 8e6f132a82549be9235dd433fc9bd28d5ae868e6
          git checkout --detach 8e6f132a82549be9235dd433fc9bd28d5ae868e6
          failed=0
          for filter in crew:: adapter_reconciliation business_os::harness_cockpit::chat::tests sync_ticket_state sync_knowledge_tables; do
            status=0
            cargo test --locked --bin ctox "$filter" -- --test-threads=1 || status=$?
            echo "Baseline 8e6f132a8: $filter exit=$status"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
