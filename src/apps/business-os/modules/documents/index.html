<section
  class="documents-module"
  data-documents-module
  data-resize-frame
>
  <!-- Shell V2 (docs/business-os-shell-v2-contract.md §3/§7): the pane heads are
       STATIC markup here — the same rule modules/tickets and modules/knowledge
       follow. index.js only fills labels, icons, option lists, counts and the
       list body; it never rebuilds a head. That keeps the head geometry (icon
       zone, header rows, window-control clearance) decidable from this file,
       puts the frame on screen before the first query returns, and stops the
       search input from losing focus on every data tick. -->
  <aside class="documents-library-pane" data-documents-library-pane>
    <div data-documents-explorer-slot>
      <section class="documents-explorer" data-documents-explorer aria-label="Dokumente">
        <header class="ctox-pane-header ctox-pane-band">
          <!-- Row 1 of the shell band: title + standing icon actions. Exactly
               ONE filled primary action per head — creating a document. -->
          <div class="ctox-pane-title-row" data-shell-v2-header-row="1">
            <div class="ctox-pane-titles">
              <h2 class="ctox-pane-title" data-documents-title>Dokumente</h2>
            </div>
            <div class="ctox-pane-actions">
              <button class="ctox-pane-icon is-primary" type="button" data-documents-new-markdown aria-label="Word-Dokument erstellen" title="Word-Dokument erstellen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
              <button class="ctox-pane-icon" type="button" data-documents-import-open aria-label="Dokument importieren" title="Dokument importieren"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M12 4 8 8M12 4l4 4M5 19h14"></path></svg></button>
              <button class="ctox-pane-icon" type="button" data-documents-export disabled aria-disabled="true" aria-label="Ausgewähltes Dokument exportieren" title="Ausgewähltes Dokument exportieren"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11M12 3 8 7M12 3l4 4M5 12v7h14v-7"></path></svg></button>
            </div>
          </div>
          <!-- Row 2 of the shell band: search + filter tray toggle. Sorting and
               the five filters live in the collapsed tray below, so this row
               stays exactly one header row high even in a narrow column. -->
          <div class="ctox-pane-tools documents-filter-bar" data-shell-v2-header-row="2">
            <input class="ctox-pane-search" type="search" data-documents-search placeholder="Dokument suchen..." aria-label="Dokumente suchen" value="">
            <button class="ctox-pane-icon documents-filter-toggle" type="button" data-documents-filter-toggle aria-expanded="false" aria-label="Filter" title="Filter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg><strong class="documents-filter-count" data-documents-filter-count hidden></strong></button>
          </div>
          <!-- Row 3: the collapsed filter tray. Option lists are data-derived,
               so index.js fills them; the controls themselves stay static. -->
          <div class="documents-filter-panel" data-shell-v2-header-row="3" data-documents-filter-panel hidden>
            <select class="ctox-pane-filter documents-filter-control" data-documents-sort aria-label="Dokumente sortieren">
              <option value="updated_desc">Zuletzt geändert</option>
              <option value="updated_asc">Älteste zuerst</option>
              <option value="title_asc">Titel A-Z</option>
              <option value="creator_app">Ersteller-App</option>
              <option value="status">Status</option>
            </select>
            <select class="ctox-pane-filter documents-filter-control" data-documents-type aria-label="Dokumenttyp filtern"></select>
            <select class="ctox-pane-filter documents-filter-control" data-documents-status aria-label="Dokumentstatus filtern"></select>
            <select class="ctox-pane-filter documents-filter-control" data-documents-app aria-label="Ersteller-App filtern"></select>
            <select class="ctox-pane-filter documents-filter-control" data-documents-source aria-label="Quelle filtern"></select>
            <select class="ctox-pane-filter documents-filter-control" data-documents-tag aria-label="Dokument-Tags filtern"></select>
            <button class="ctox-button documents-filter-reset" type="button" data-documents-clear-filters disabled aria-disabled="true">Filter zurücksetzen</button>
          </div>
          <div class="documents-active-filters" data-documents-active-filters aria-label="Aktive Filter" hidden></div>
        </header>
        <div class="documents-list" data-documents-list>
          <div class="ctox-empty documents-empty" data-documents-list-placeholder>
            <strong>Dokumente</strong>
            <span>Dokumente werden geladen.</span>
          </div>
        </div>
      </section>
    </div>
  </aside>

  <button
    class="ctox-column-resizer documents-library-resizer"
    type="button"
    data-resizer="left"
    data-resizer-var="--documents-library-width"
    data-resizer-min="220"
    data-resizer-max="560"
    aria-label="Breite der Dokumentliste ändern"
    title="Breite der Dokumentliste ändern"
  ></button>

  <main class="documents-workbench">
    <!-- The centre head is the last head of the top row while the actions
         drawer is closed, so it carries the 74x74 window-control clearance.
         index.js fills its content (current document / mail-merge navigator +
         the single Aktionen action); the head element itself is static. -->
    <header class="ctox-pane-header ctox-pane-band documents-document-strip" data-documents-document-strip></header>
    <div class="documents-editor-shell" data-documents-editor>
      <div class="ctox-empty documents-empty">
        <strong>Dokumente</strong>
        <span>Dokument wird vorbereitet.</span>
      </div>
    </div>
  </main>

  <button
    class="ctox-column-resizer documents-actions-resizer"
    type="button"
    data-documents-actions-resizer
    data-resizer="right"
    data-resizer-var="--documents-actions-width"
    data-resizer-min="280"
    data-resizer-max="560"
    aria-label="Breite der Aktionsspalte ändern"
    title="Breite der Aktionsspalte ändern"
    hidden
  ></button>

  <button
    class="documents-drawer-backdrop"
    type="button"
    data-documents-drawer-backdrop
    aria-label="Seitenleiste schließen"
    hidden
  ></button>
  <aside
    id="documents-actions-drawer"
    class="documents-actions-drawer"
    data-documents-actions-drawer
    aria-label="Dokumentaktionen"
    aria-hidden="true"
    hidden
  >
    <div data-documents-actions-content></div>
  </aside>
</section>
