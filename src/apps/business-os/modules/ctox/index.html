<main class="ctox-workspace crew-home-app" data-crew-home>
  <section class="ctox-pane crew-home-pane">
    <header class="ctox-pane-header crew-app-header">
      <h2 class="ctox-pane-title" data-app-title></h2>
      <nav data-navigation></nav>
    </header>
    <div class="crew-status" data-status role="status" aria-live="polite"></div>
    <div class="crew-notice" data-notice role="status" aria-live="polite" hidden></div>
    <div class="crew-view" data-content tabindex="-1"></div>
  </section>
  <aside class="crew-profile" data-profile role="dialog" hidden></aside>
  <div class="crew-dialog-layer" data-dialog hidden></div>
</main>
