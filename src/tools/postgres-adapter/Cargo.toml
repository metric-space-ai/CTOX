[package]
name = "ctox-postgres-adapter"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Generic PostgreSQL connector for CTOX external data synchronization"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ctox-sqlserver-adapter = { path = "../sqlserver-mcp" }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
uuid = "1"
